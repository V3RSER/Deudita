<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>Prueba de correo — Deudita</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f8;
            color: #202124;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 24px;
        }

        .muted {
            color: #6b7280;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-top: 16px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button, select, input {
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 9px 14px;
            cursor: pointer;
            background: #1a73e8;
            color: white;
        }

        button.secondary {
            background: #eef2f7;
            color: #202124;
        }

        button:disabled {
            opacity: .55;
            cursor: default;
        }

        input, select {
            border: 1px solid #c9cdd3;
            border-radius: 7px;
            padding: 9px 10px;
            background: white;
        }

        input.search {
            min-width: 320px;
            flex: 1;
        }

        .search-mode {
            display: none;
            width: 100%;
        }

        .search-mode.active {
            display: flex;
            gap: 10px;
        }

        .status {
            margin-top: 12px;
            color: #5f6368;
            min-height: 20px;
        }

        .emails {
            margin-top: 12px;
            display: grid;
            gap: 8px;
        }

        .email {
            text-align: left;
            border: 1px solid #ddd;
            background: white;
            color: #202124;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .email:hover {
            border-color: #1a73e8;
        }

        .email.selected {
            border: 2px solid #1a73e8;
            padding: 11px;
        }

        .email-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .subject {
            font-weight: 600;
        }

        .from {
            margin-top: 4px;
            color: #5f6368;
            font-size: 13px;
        }

        .snippet {
            margin-top: 7px;
            color: #4b5563;
            font-size: 13px;
        }

        .detail {
            white-space: pre-wrap;
            word-break: break-word;
            background: #f8f9fa;
            border-radius: 7px;
            padding: 12px;
            max-height: 300px;
            overflow: auto;
        }

        .result {
            margin-top: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .kv {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 7px;
        }

        .kv b {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 3px;
        }

        .error {
            color: #b42318;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Probar un correo</h1>
    <div class="muted">Selecciona un correo de Gmail para ejecutar el flujo completo de detección y creación de gasto borrador.</div>

    <div id="connBar" style="margin-top: 14px; padding: 10px 14px; background: #e8f0fe; border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
        <div>
            <b>Conexión:</b> <span id="connBackend">Cargando...</span> | <b>Token Webhook:</b> <span id="connToken">Verificando...</span>
        </div>
        <div>
            <button onclick="promptToken()" class="secondary" style="padding: 4px 10px; font-size: 12px;">Configurar Token</button>
        </div>
    </div>

    <div class="card">
        <div class="toolbar">
            <button id="loadBtn" onclick="loadEmails()">Cargar correos</button>
            <button id="refreshCacheBtn" class="secondary" onclick="refreshCache()">Renovar caché</button>
            <select id="count" title="Cantidad">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
        </div>

        <div id="status" class="status"></div>
        <div id="emails" class="emails"></div>
    </div>
</div>

<script>
    let emails = [];
    let running = false;

    function checkConnection() {
        google.script.run
            .withSuccessHandler(function (info) {
                if (info) {
                    document.getElementById('connBackend').textContent = info.backendUrl || 'Por defecto';
                    const tokenSpan = document.getElementById('connToken');
                    if (info.hasToken) {
                        tokenSpan.textContent = 'Activo (' + (info.tokenMasked || 'OK') + ')';
                        tokenSpan.style.color = '#137333';
                    } else {
                        tokenSpan.textContent = 'No configurado ⚠️';
                        tokenSpan.style.color = '#c5221f';
                    }
                }
            })
            .getConnectionInfo();
    }

    function promptToken() {
        const val = prompt('Ingresa tu token de webhook de Deudita (lo obtienes en la app al presionar "Conectar Gmail"):');
        if (val && val.trim()) {
            setStatus('Guardando token…');
            google.script.run
                .withSuccessHandler(function () {
                    setStatus('Token guardado correctamente.');
                    checkConnection();
                    refreshCache();
                })
                .withFailureHandler(function (err) {
                    setStatus(err && err.message ? err.message : String(err), true);
                })
                .saveTokenFromUi(val.trim());
        }
    }

    function setStatus(text, error) {
        const el = document.getElementById('status');
        el.textContent = text || '';
        el.className = 'status' + (error ? ' error' : '');
    }

    function loadEmails() {
        const count = Number(document.getElementById('count').value);

        setStatus('Cargando correos…');
        document.getElementById('loadBtn').disabled = true;
        document.getElementById('emails').innerHTML = '';

        google.script.run
            .withSuccessHandler(function (rows) {
                emails = rows || [];
                renderEmails();
                document.getElementById('loadBtn').disabled = false;
                setStatus(
                    emails.length
                        ? emails.length + ' correo(s) encontrado(s).'
                        : 'No se encontraron correos.'
                );
            })
            .withFailureHandler(function (err) {
                document.getElementById('loadBtn').disabled = false;
                setStatus(err && err.message ? err.message : String(err), true);
            })
            .getTestEmails({mode: 'recent', count: count});
    }

    function renderEmails() {
        const container = document.getElementById('emails');
        container.innerHTML = '';

        emails.forEach(function (email, index) {
            const button = document.createElement('button');
            button.className = 'email';
            button.disabled = running;
            button.onclick = function () {
                selectEmail(index);
            };

            const date = new Date(email.date).toLocaleString();
            button.innerHTML =
                '<div class="email-head">' +
                '<span class="subject">' + esc(email.subject || '(sin asunto)') + '</span>' +
                '<span class="muted">' + esc(date) + '</span>' +
                '</div>' +
                '<div class="from">' + esc(email.from || '') + '</div>' +
                '<div class="snippet">' + esc(email.snippet || '') + '</div>';

            container.appendChild(button);
        });
    }

    function selectEmail(index) {
        if (running || !emails[index]) return;

        const email = emails[index];
        running = true;
        renderEmails();

        setStatus('Ejecutando el flujo completo para el correo seleccionado…');

        google.script.run
            .withSuccessHandler(function (res) {
                running = false;
                renderEmails();
                if (res && res.error) {
                    setStatus('Error: ' + res.error, true);
                } else if (res && res.expensesSent > 0) {
                    setStatus('✅ Gasto borrador creado exitosamente en Deudita (revisa la sección Borradores de la app).');
                } else if (res && res.expensesFailed > 0) {
                    const errDetail = res.lastResult && res.lastResult.error ? res.lastResult.error : 'Código de error en la API';
                    setStatus('❌ Error al crear el borrador en /api/expenses: ' + errDetail, true);
                } else if (res && res.matchesFound === 0) {
                    setStatus('ℹ️ El correo fue analizado pero no coincidió con ninguna plantilla de entidad bancaria.');
                } else {
                    setStatus('Proceso completado.');
                }
            })
            .withFailureHandler(function (err) {
                running = false;
                renderEmails();
                setStatus(err && err.message ? err.message : String(err), true);
            })
            .syncExpenseEmails(email.id);
    }

    function refreshCache() {
        setStatus('Renovando caché de plantillas…');
        document.getElementById('refreshCacheBtn').disabled = true;

        google.script.run
            .withSuccessHandler(function (result) {
                document.getElementById('refreshCacheBtn').disabled = false;
                const count = Array.isArray(result) ? result.length : 0;
                setStatus('Caché renovada. Plantillas cargadas: ' + count + '.');
            })
            .withFailureHandler(function (err) {
                document.getElementById('refreshCacheBtn').disabled = false;
                setStatus(err && err.message ? err.message : String(err), true);
            })
            .forceRefreshTemplates();
    }

    function esc(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    window.addEventListener('load', function () {
        checkConnection();
        loadEmails();
    });
</script>
</body>
</html>
